<!doctype html>
<!-- @dsCard group="UI Kit" name="UI Kit · You tab" subtitle="Profile header + settings-hub sections" viewport="390x844" -->
<html><head><meta charset="utf-8"><title>UI Kit · You tab</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  html,body{height:100%}
  .phone{width:390px;height:844px;display:flex;flex-direction:column;background:var(--color-paper);overflow:hidden}
  .body{flex:1;overflow:hidden;padding:var(--space-s5) var(--space-s5) 0}
  .profile{display:flex;flex-direction:column;align-items:center}
  .profile .big{width:64px;height:64px;font-size:var(--fs-body)}
  .profile .name{font-family:var(--font-display);font-size:var(--fs-display-s);letter-spacing:-.5px;color:var(--color-graphite);margin-top:var(--space-s3)}
  .profile .email{font-family:var(--font-mono);font-size:var(--fs-body-s);color:var(--color-lead);margin-top:4px}
  .edit{margin-top:var(--space-s4);padding:var(--space-s2) var(--space-s4);border:.5px solid var(--color-graphite);border-radius:6px;
        font-family:var(--font-mono);font-size:var(--fs-caption);color:var(--color-graphite);letter-spacing:.3px;background:none}
  .settings-eyebrow{margin-top:var(--space-s5)}
  .chev{font-family:var(--font-mono);font-size:var(--fs-body-s);color:var(--color-lead)}
  .version{font-family:var(--font-mono);font-size:var(--fs-caption);color:var(--color-lead);text-align:center;letter-spacing:.3px;margin-top:var(--space-s4)}
  .tabbar{background:var(--color-paper);border-top:1.5px solid var(--color-graphite);padding-top:8px;display:flex}
  .tb{flex:1;text-align:center;padding-bottom:22px;font-family:var(--font-mono);font-size:var(--fs-caption);color:var(--color-lead)}
  .tb.on{color:var(--color-graphite)}
  .tb svg{display:block;margin:0 auto 3px}
</style></head><body class="ds">
<div class="phone">
  <div class="topbar"><span class="wordmark"><span class="wordmark-text">Chara</span><span class="wordmark-rule"></span></span></div>
  <div class="body">
    <div class="profile">
      <span class="avatar big">LD</span>
      <div class="name">Lucas Dow</div>
      <div class="email">lucas@example.com</div>
      <button class="edit">EDIT PROFILE</button>
    </div>

    <div class="settings-eyebrow">ACCOUNTS</div>
    <div class="settings-list">
      <div class="settings-row"><div class="label">Chara Cloud</div><div class="value">default</div></div>
      <div class="settings-row"><div class="label">home.lurkhuset.com</div><div class="value">linked</div></div>
      <div class="settings-row"><div class="label">Add a server</div><div class="chev">›</div></div>
    </div>

    <div class="settings-eyebrow">PREFERENCES</div>
    <div class="settings-list">
      <div class="settings-row"><div class="label">Language</div><div class="value">svenska</div></div>
    </div>

    <div class="settings-eyebrow">ABOUT</div>
    <div class="settings-list">
      <div class="settings-row"><div class="label">Privacy policy</div><div class="chev">›</div></div>
      <div class="settings-row"><div class="label">Sign out</div><div class="chev" style="color:var(--color-brick)">›</div></div>
    </div>

    <div class="version">1.4.2 (204)</div>
  </div>
  <div class="tabbar">
    <div class="tb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5A4E" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home</div>
    <div class="tb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5A4E" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Activity</div>
    <div class="tb on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2D1F1A" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>You</div>
  </div>
</div></body></html>
