<!doctype html>
<!-- @dsCard group="UI Kit" name="UI Kit · Group detail" subtitle="Top bar, hero balance, expenses list, tab bar" viewport="390x844" -->
<html><head><meta charset="utf-8"><title>UI Kit · Group detail</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  html,body{height:100%}
  .phone{width:390px;height:844px;display:flex;flex-direction:column;background:var(--color-paper);overflow:hidden}
  .body{flex:1;overflow:hidden;padding:0 var(--space-s5)}
  .hero{padding:var(--space-s6) 0 var(--space-s5);text-align:center}
  .hero .eyebrow{font-family:var(--font-mono-medium);font-size:var(--fs-caption);letter-spacing:.4px;color:var(--color-lead)}
  .hero .amt{margin-top:var(--space-s2);font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .hero .sub{margin-top:var(--space-s2);font-family:var(--font-body);font-size:var(--fs-body-s);color:var(--color-lead)}
  .segs{display:flex;gap:var(--space-s5);border-bottom:1px solid var(--color-rule-soft);margin-bottom:var(--space-s4)}
  .seg{padding-bottom:10px;font-family:var(--font-body-medium);font-size:var(--fs-body);color:var(--color-lead)}
  .seg.on{color:var(--color-graphite);box-shadow:inset 0 -1.5px 0 var(--color-graphite)}
  .cardrow{display:flex;align-items:center;gap:var(--space-s3)}
  .cardrow .mid{flex:1;min-width:0}
  .cta{position:relative;margin:var(--space-s4) 0 var(--space-s5)}
  .cta .btn{width:100%}
  .tabbar{background:var(--color-paper);border-top:1.5px solid var(--color-graphite);padding-top:8px;display:flex}
  .tb{flex:1;text-align:center;padding-bottom:22px;font-family:var(--font-mono);font-size:var(--fs-caption);color:var(--color-lead)}
  .tb.on{color:var(--color-graphite)}
  .tb svg{display:block;margin:0 auto 3px}
</style></head><body class="ds">
<div class="phone">
  <div class="topbar">
    <span style="font-family:var(--font-mono);font-size:13px;color:var(--color-lead)">‹ Back</span>
    <span class="title">Kōya trip</span>
    <span style="font-family:var(--font-mono);font-size:13px;color:var(--color-lead)">⋯</span>
  </div>
  <div class="body">
    <div class="hero">
      <div class="eyebrow">YOU ARE OWED</div>
      <div class="amt ty-amount-hero" style="color:var(--color-moss)">420,00</div>
      <div class="sub">across 4 members · SEK</div>
    </div>
    <div class="segs"><div class="seg on">Expenses</div><div class="seg">Standings</div></div>

    <div class="card cardrow">
      <span class="avatar avatar-sm">LD</span>
      <div class="mid"><div class="ty-body-emphasis">Ryokan, two nights</div>
        <div class="ty-mono-caption" style="color:var(--color-lead);margin-top:3px;white-space:nowrap">you paid · 4 ways · May 15</div></div>
      <div class="ty-amount-s amount amount-neutral">4 800,00</div>
    </div>
    <div class="card cardrow">
      <span class="avatar avatar-sm">MK</span>
      <div class="mid"><div class="ty-body-emphasis">Train tickets</div>
        <div class="ty-mono-caption" style="color:var(--color-lead);margin-top:3px;white-space:nowrap">Mira paid · 4 ways · May 14</div></div>
      <div class="ty-amount-s amount amount-neutral">1 120,00</div>
    </div>
    <div class="card cardrow">
      <span class="avatar avatar-sm">AR</span>
      <div class="mid"><div class="ty-body-emphasis">Dinner at Kōya</div>
        <div class="ty-mono-caption" style="color:var(--color-lead);margin-top:3px;white-space:nowrap">Aro paid · 3 ways · May 13</div></div>
      <div class="ty-amount-s amount amount-neutral">880,00</div>
    </div>

    <div class="cta"><button class="btn btn-primary">Add expense</button></div>
  </div>
  <div class="tabbar">
    <div class="tb on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2D1F1A" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home</div>
    <div class="tb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5A4E" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Activity</div>
    <div class="tb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5A4E" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>You</div>
  </div>
</div></body></html>
