<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Scale" subtitle="4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 96" viewport="700x345" -->
<html><head><meta charset="utf-8"><title>Spacing · Scale</title>
<link rel="stylesheet" href="../tokens.css">
<style>.wrap{padding:24px}
.row{display:flex;align-items:center;gap:14px;margin-bottom:9px}
.tok{font-family:var(--font-mono);font-size:12px;color:var(--color-lead);min-width:120px}
.bar{height:18px;background:var(--color-graphite)}
.bx{background:var(--color-bone);width:96px;height:64px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;color:var(--color-lead)}
.grid{display:flex;gap:16px;flex-wrap:wrap}
.note{font-family:var(--font-body);font-size:14px;color:var(--color-lead);margin-top:18px;max-width:640px;line-height:1.5}</style></head><body class="ds">
<div class="wrap">
<div class="row"><div class="tok">s1 · 4px</div><div class="bar" style="width:4px"></div></div>
<div class="row"><div class="tok">s2 · 8px</div><div class="bar" style="width:8px"></div></div>
<div class="row"><div class="tok">s3 · 12px</div><div class="bar" style="width:12px"></div></div>
<div class="row"><div class="tok">s4 · 16px</div><div class="bar" style="width:16px"></div></div>
<div class="row"><div class="tok">s5 · 24px</div><div class="bar" style="width:24px"></div></div>
<div class="row"><div class="tok">s6 · 32px</div><div class="bar" style="width:32px"></div></div>
<div class="row"><div class="tok">s7 · 48px</div><div class="bar" style="width:48px"></div></div>
<div class="row"><div class="tok">s8 · 64px</div><div class="bar" style="width:64px"></div></div>
<div class="row"><div class="tok">s9 · 96px</div><div class="bar" style="width:96px"></div></div>
<div class="note">Screen gutters are <code>s5</code> (24). Card padding and settings-row vertical padding are <code>s4</code> (16). Cards in a list are separated by <code>s2</code> (8).</div></div></body></html>
