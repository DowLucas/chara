<!doctype html>
<!-- @dsCard group="Components" name="Components · Bone cards" subtitle="The primary content-list vocabulary" viewport="700x330" -->
<html><head><meta charset="utf-8"><title>Components · Bone cards</title>
<link rel="stylesheet" href="../tokens.css">
<style>.wrap{padding:24px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--color-lead);min-width:92px}
.note{font-family:var(--font-body);font-size:14px;color:var(--color-lead);margin-top:16px;max-width:640px;line-height:1.5}
.pane{max-width:420px}</style></head><body class="ds">
<div class="wrap"><div class="pane">
 <div class="card" style="display:flex;align-items:center;gap:12px">
   <span class="avatar" style="background:var(--accent-1);color:var(--color-fg-on-accent);border-color:transparent">KY</span>
   <div style="flex:1;min-width:0">
     <div class="ty-title" style="letter-spacing:-.3px">Kōya trip</div>
     <div class="ty-mono-caption" style="color:var(--color-lead);margin-top:3px">4 members · 12 expenses</div>
   </div>
   <div class="ty-amount-s amount amount-pos">+420,00</div>
 </div>
 <div class="card" style="display:flex;align-items:center;gap:12px">
   <span class="avatar" style="background:var(--accent-5);color:var(--color-fg-on-accent);border-color:transparent">FL</span>
   <div style="flex:1;min-width:0">
     <div class="ty-title" style="letter-spacing:-.3px">Flat 3B</div>
     <div class="ty-mono-caption" style="color:var(--color-lead);margin-top:3px">3 members · 41 expenses</div>
   </div>
   <div class="ty-amount-s amount amount-neg">−1 240,00</div>
 </div>
 <div class="note">Bone on paper, radius 10, <strong>no border</strong>, 16px padding, 8px between cards. Reserve the hairline-divider list for dense previews.</div>
</div></div></body></html>
