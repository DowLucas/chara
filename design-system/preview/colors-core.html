<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Core" subtitle="Paper, bone, graphite, lead" viewport="700x230" -->
<html><head><meta charset="utf-8"><title>Colors · Core</title>
<link rel="stylesheet" href="../tokens.css">
<style>.wrap{padding:24px}
.grid{display:flex;flex-wrap:wrap;gap:14px}
.sw{width:150px}
.chipbox{height:56px;border-radius:6px;border:0.5px solid var(--color-rule-soft)}
.nm{font-family:var(--font-body-medium);font-size:14px;margin-top:6px;color:var(--color-graphite)}
.hex{font-family:var(--font-mono);font-size:12px;color:var(--color-lead)}
.note{font-family:var(--font-body);font-size:14px;color:var(--color-lead);margin-top:18px;max-width:640px;line-height:1.5}</style></head><body class="ds">
<div class="wrap"><div class="grid">
<div class="sw"><div class="chipbox" style="background:var(--color-paper)"></div><div class="nm">paper</div><div class="hex">#F0E5CC</div></div>
<div class="sw"><div class="chipbox" style="background:var(--color-bone)"></div><div class="nm">bone</div><div class="hex">#E6D9BB</div></div>
<div class="sw"><div class="chipbox" style="background:var(--color-graphite)"></div><div class="nm">graphite</div><div class="hex">#2D1F1A</div></div>
<div class="sw"><div class="chipbox" style="background:var(--color-lead)"></div><div class="nm">lead</div><div class="hex">#6B5A4E</div></div>
</div><div class="note">Paper is the app canvas; bone is the content surface. Cards are bone on paper with <em>no border</em> — the contrast does the separation. Graphite is ink, lead is secondary ink.</div></div></body></html>
